<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masuk · TaskFlow</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo-sekolah.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="logo"><img class="logo-img" src="assets/images/logo-sekolah.jpg" alt="Logo SMK Bagimu Negeriku"><span>TaskFlow<small class="school">SMK Bagimu Negeriku</small></span></div>
      <h1>Selamat Datang Kembali</h1>
      <p class="sub">Atur tugasmu, tetap produktif.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="kamu@contoh.com" autocomplete="email"><p class="error"></p></div>
        <div class="field"><label for="password">Kata Sandi</label><input id="password" name="password" type="password" placeholder="Kata sandi kamu" autocomplete="current-password"><p class="error"></p></div>
        <div class="row">
          <label class="check-label"><input type="checkbox" name="remember"> Ingat saya</label>
          <a href="#" id="forgot">Lupa kata sandi?</a>
        </div>
        <button class="btn btn-primary btn-block">Masuk</button>
      </form>
      <p class="auth-foot">Belum punya akun? <a href="register.html">Buat akun</a></p>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
