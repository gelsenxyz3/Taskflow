<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar · TaskFlow</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo-sekolah.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/loader.js"></script>
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="logo"><img class="logo-img" src="assets/images/logo-sekolah.jpg" alt="Logo SMK Bagimu Negeriku"><span>TaskFlow<small class="school">SMK Bagimu Negeriku</small></span></div>
      <h1>Buat akun</h1>
      <p class="sub">Mulai atur harimu dalam hitungan menit.</p>
      <form id="registerForm" novalidate>
        <div class="field"><label for="name">Nama Lengkap</label><input id="name" name="name" type="text" placeholder="Nama kamu" autocomplete="name"><p class="error"></p></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="kamu@contoh.com" autocomplete="email"><p class="error"></p></div>
        <div class="field"><label for="password">Kata Sandi</label><input id="password" name="password" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password"><p class="error"></p></div>
        <div class="field"><label for="confirm">Konfirmasi Kata Sandi</label><input id="confirm" name="confirm" type="password" placeholder="Ulangi kata sandi" autocomplete="new-password"><p class="error"></p></div>
        <button class="btn btn-primary btn-block">Buat Akun</button>
      </form>
      <p class="auth-foot">Sudah punya akun? <a href="login.html">Kembali ke halaman masuk</a></p>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
